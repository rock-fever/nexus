spring:
  application:
    name: nexus
      
  datasource:
    url: jdbc:postgresql://localhost:5433/nexus
    username: nexus
    password: nexus
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  data:
    mongodb:
      uri: mongodb://localhost:27018/nexus
    redis:
      host: localhost
      port: 6380

  kafka:
    bootstrap-servers: localhost:9093
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: nexus-group
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      auto-offset-reset: earliest
      properties:
        spring.json.trusted.packages: "com.nexus.*"

server:
  port: 8081

nexus:
  admin:
    username: admin
    password: admin
  
  jwt:
    secret: "nexus-admin-jwt-secret-key-change-in-production-must-be-32-chars-min"
    expiration-ms: 86400000  # 24 hours

  rate-limit:
    free-plan-rpm: 60
    pro-plan-rpm: 600

  resilience:
    circuit-breaker:
      failure-rate-threshold: 50
      wait-duration-open-ms: 30000
      sliding-window-size: 10
    bulkhead:
      free-plan-max-concurrent: 5
      pro-plan-max-concurrent: 50
      enterprise-plan-max-concurrent: 500

logging:
  level:
    com.nexus: DEBUG
    org.springframework.security: INFO

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
